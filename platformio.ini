; Nat X Dg Scanner - multi chip
; Build semua : pio run
; Satu chip   : pio run -e esp32s3   (esp8266 | esp32 | esp32s3 | esp32c3 | esp32c6)

[common]
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit BusIO@^1.16.1

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
lib_deps = ${common.lib_deps}

; ESP32 family memakai Arduino-ESP32 3.x (pioarduino) supaya C6 ikut didukung
[esp32base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}

[env:esp32]
extends = esp32base
board = esp32dev

[env:esp32s3]
extends = esp32base
board = esp32-s3-devkitc-1

[env:esp32c3]
extends = esp32base
board = esp32-c3-devkitm-1

[env:esp32c6]
extends = esp32base
board = esp32-c6-devkitc-1
