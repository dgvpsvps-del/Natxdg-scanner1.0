name: Build firmware (semua chip)
on:
  push:
    paths-ignore:
      - "firmware/**"
      - "**.md"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio esptool
      - run: pio run
      - name: Paket .bin
        run: |
          mkdir -p firmware
          rm -f firmware/*.bin
          cp .pio/build/esp8266/firmware.bin firmware/NatXDgScanner_ESP8266.bin
          BOOTAPP0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOTAPP0"
          pack() {  # env chip bootloader_offset output
            python -m esptool --chip "$2" merge_bin -o "firmware/$4" --flash_mode dio \
              "$3" ".pio/build/$1/bootloader.bin" \
              0x8000 ".pio/build/$1/partitions.bin" \
              0xe000 "$BOOTAPP0" \
              0x10000 ".pio/build/$1/firmware.bin"
          }
          pack esp32   esp32   0x1000 NatXDgScanner_ESP32.bin
          pack esp32s3 esp32s3 0x0    NatXDgScanner_ESP32-S3.bin
          pack esp32c3 esp32c3 0x0    NatXDgScanner_ESP32-C3.bin
          pack esp32c6 esp32c6 0x0    NatXDgScanner_ESP32-C6.bin
          ls -la firmware
      - uses: actions/upload-artifact@v4
        with:
          name: NatXDgScanner-bin
          path: firmware/*.bin
      - name: Simpan .bin ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A firmware
          git commit -m "Build firmware .bin" || echo "no changes"
          git push
