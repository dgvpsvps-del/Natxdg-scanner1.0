name: Build NatXDgScanner.bin
on:
  push:
    paths-ignore:
      - "firmware/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run
      - run: |
          mkdir -p firmware
          cp .pio/build/d1_mini/firmware.bin firmware/NatXDgScanner.bin
      - uses: actions/upload-artifact@v4
        with:
          name: NatXDgScanner-bin
          path: firmware/NatXDgScanner.bin
      - name: Simpan .bin ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add firmware/NatXDgScanner.bin
          git commit -m "Build NatXDgScanner.bin" || echo "no changes"
          git push
