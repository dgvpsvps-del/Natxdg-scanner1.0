name: Build NatXDgScanner.bin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      - run: pio run
      - run: cp .pio/build/d1_mini/firmware.bin NatXDgScanner.bin
      - uses: actions/upload-artifact@v4
        with:
          name: NatXDgScanner-bin
          path: NatXDgScanner.bin
